# Builds the site for every pull request into main, so a change that would
# break the build shows a ✗ on the pull request before it is merged (merging
# to main publishes the site via pages.yml). Branch protection on main
# requires this check to pass.
name: Build check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astryx-variants
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astryx-variants/package-lock.json
      - run: npm ci
      # Type-checks (tsc -b) and builds the production site.
      - run: npm run build
